spring.application.name=rental-api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=DEBUG
security.jwt.secret=${SECURITY_JWT_SECRET:2MDfPjc5n4dfHvXZ1CIlshHOsZ5MGTDH8AX8wAObKKStiWtNx53YdPylhNTxZzaM}

security.jwt.expiration-seconds=3600

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-gmail-address@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.mail.from=${MAIL_FROM:your-gmail-address@gmail.com}
app.mail.reset-base-url=${MAIL_RESET_BASE_URL:https://rental-app-frontend-six.vercel.app/reset-password}
app.mail.reset-token-ttl-minutes=${MAIL_RESET_TTL_MINUTES:10}

# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp automation
# ─────────────────────────────────────────────────────────────────────────────
automation.enabled=${AUTOMATION_ENABLED:true}

# Provider: ULTRAMSG (default, easiest) | WPPCONNECT (free, self-hosted) | META (official Cloud API)
automation.whatsapp.provider=${WHATSAPP_PROVIDER:ULTRAMSG}

# UltraMsg — sign up at https://ultramsg.com and grab the Instance ID + token from the dashboard
automation.whatsapp.ultramsg.instance-id=instance179560
automation.whatsapp.ultramsg.token=80j1q3c327295cfx
automation.whatsapp.ultramsg.api-base-url=${ULTRAMSG_API_BASE_URL:https://api.ultramsg.com}

# WPPConnect (self-hosted, no Meta account needed) — see wppconnect-team/wppconnect-server
automation.whatsapp.wppconnect.base-url=${WPPCONNECT_BASE_URL:http://localhost:21465}
automation.whatsapp.wppconnect.session-name=${WPPCONNECT_SESSION:agency}
automation.whatsapp.wppconnect.secret-key=${WPPCONNECT_SECRET_KEY:julia-rental-secret-2026}

# WhatsApp Cloud API (only used when automation.whatsapp.provider=META)
automation.whatsapp.token=${WHATSAPP_TOKEN:}
automation.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
automation.whatsapp.api-version=${WHATSAPP_API_VERSION:v19.0}
automation.whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
automation.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:change_me}

# Timing — all durations match the spec; tweak without redeploying.
automation.timing.abandon-timeout-minutes=${ABANDON_TIMEOUT_MINUTES:10}
automation.timing.upsell-delay-minutes=${UPSELL_DELAY_MINUTES:5}
automation.timing.reminder-lead-hours=${REMINDER_LEAD_HOURS:24}
automation.timing.review-delay-hours=${REVIEW_DELAY_HOURS:24}
automation.timing.reminder-cron-interval-ms=${REMINDER_CRON_INTERVAL_MS:3600000}
automation.timing.dispatcher-poll-ms=${DISPATCHER_POLL_MS:5000}

# Polling fallback
automation.polling.enabled=${POLLING_ENABLED:true}
automation.polling.interval-ms=${POLLING_INTERVAL_MS:30000}

# Frontend base URL — used to build booking links shown in WhatsApp messages.
app.frontend.base-url=${FRONTEND_BASE_URL:https://rental-app-frontend-six.vercel.app}

