spring.application.name=rental-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
//spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG
security.jwt.secret=${SECURITY_JWT_SECRET}

security.jwt.expiration-seconds=3600

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}

app.mail.from=${MAIL_FROM}
app.mail.reset-base-url=${MAIL_RESET_BASE_URL}
app.mail.reset-token-ttl-minutes=${MAIL_RESET_TTL_MINUTES}

server.port=${PORT:8080}



