spring.datasource.url=jdbc:h2:mem:rental_app_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

security.jwt.secret=test-secret
security.jwt.expiration-seconds=3600

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=test@example.com
app.mail.reset-base-url=http://localhost/reset
app.mail.reset-token-ttl-minutes=30

app.cors.allowed-origins=http://localhost

logging.level.org.springframework.security=INFO
